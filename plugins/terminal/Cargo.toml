[package]
name = "plugin-terminal"
description = "Плагин-заполнитель терминала: настоящий терминал заменит содержимое crate в P2.2 под тем же id"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellio-layout = { path = "../../crates/shellio-layout" }
shellio-plugin-api = { path = "../../crates/shellio-plugin-api" }
shellio-plugin-view = { path = "../../crates/shellio-plugin-view" }

[lints]
workspace = true
