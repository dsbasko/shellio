[package]
name = "probe-session-survival"
description = "Проба P0.4: выживание сессий, zmx и Rust-хост"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"
# Каждый бинарь объявляется в задаче плана, где появляется его файл.
autobins = false

# Функции по умолчанию выключены, make check их не включает (ADR-0035). vt и surface одним вызовом
# cargo не включаются, это проверяет run.sh.
[features]
# FFI над набором libghostty-vt пробы и раннер матрицы.
vt = []
# Поверхность libghostty в подписанном бандле пробы.
surface = [
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-core-foundation",
    "dep:objc2-core-graphics",
    "dep:objc2-foundation",
    "dep:shellio-sys-ghostty",
]
# Хост с замороженным протоколом v1 для G1 и G2, собирается отдельным вызовом.
proto-v1 = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "probe-session"
path = "src/bin/runner.rs"
required-features = ["vt"]

[[bin]]
name = "probe-session-fixture"
path = "src/bin/fixture.rs"

[[bin]]
name = "probe-session-host"
path = "src/bin/host.rs"
required-features = ["vt"]

[[bin]]
name = "probe-session-attach"
path = "src/bin/attach.rs"

[[bin]]
name = "probe-session-surface"
path = "src/bin/surface.rs"
required-features = ["surface"]

[dependencies]
libc = "0.2.191"
objc2 = { version = "0.6.5", optional = true }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "NSApplication",
    "NSEvent",
    "NSGraphics",
    "NSResponder",
    "NSRunningApplication",
    "NSTextInputClient",
    "NSTextInputContext",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "CFRunLoop",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
] }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSDate",
    "NSGeometry",
    "NSObjCRuntime",
    "NSRange",
    "NSRunLoop",
    "NSString",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellio-sys-ghostty = { path = "../../crates/shellio-sys-ghostty", optional = true }

[lints]
workspace = true
