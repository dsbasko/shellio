[package]
name = "probe-diff-view"
description = "Проба P0.6: виртуальный diff на AppKit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
libc = "0.2.191"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "NSApplication",
    "NSColor",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
] }
objc2-core-text = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-graphics",
    "CTFont",
    "CTLine",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDate",
    "NSEnumerator",
    "NSGeometry",
    "NSNotification",
    "NSObjCRuntime",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSTimer",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CADisplayLink",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"

[lints]
workspace = true
