[package]
name = "probe-diff-view"
description = "Проба P0.6: виртуальный diff на AppKit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
block2 = "0.6.2"
dispatch2 = { version = "0.3.0", default-features = false, features = ["std", "objc2"] }
libc = "0.2.191"
memchr = "2.8.3"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "block2",
    "NSAccessibility",
    "NSAccessibilityConstants",
    "NSAccessibilityElement",
    "NSAccessibilityProtocols",
    "NSAnimationContext",
    "NSAppearance",
    "NSApplication",
    "NSClipView",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSGraphicsContext",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSScrollView",
    "NSTableColumn",
    "NSTableHeaderView",
    "NSTableRowView",
    "NSTableView",
    "NSText",
    "NSTextView",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFAttributedString",
    "CFCGTypes",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "CGColor",
    "CGContext",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGError",
    "CGEvent",
    "CGEventTypes",
    "CGRemoteOperation",
    "CGWindow",
] }
objc2-core-text = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-graphics",
    "CTFont",
    "CTLine",
    "CTStringAttributes",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSEnumerator",
    "NSGeometry",
    "NSIndexSet",
    "NSNotification",
    "NSObjCRuntime",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "NSValue",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CADisplayLink",
] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-video",
    "CMBase",
    "CMSampleBuffer",
    "CMTime",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVReturn",
] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-media",
    "SCShareableContent",
    "SCStream",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"

[lints]
workspace = true
