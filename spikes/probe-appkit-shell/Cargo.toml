[package]
name = "probe-appkit-shell"
description = "Проба P0.2: AppKit-каркас на objc2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
block2 = "0.6.2"
dispatch2 = { version = "0.3.0", default-features = false, features = ["std", "objc2"] }
libc = "0.2.191"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "NSAccessibility",
    "NSAccessibilityConstants",
    "NSAccessibilityProtocols",
    "NSAppearance",
    "NSApplication",
    "NSBitmapImageRep",
    "NSButton",
    "NSCell",
    "NSClipView",
    "NSColor",
    "NSColorSpace",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSImageView",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSOutlineView",
    "NSPanel",
    "NSPopUpButton",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSScrollView",
    "NSScroller",
    "NSSplitView",
    "NSSplitViewController",
    "NSSplitViewItem",
    "NSTableCellView",
    "NSTableColumn",
    "NSTableHeaderView",
    "NSTableRowView",
    "NSTableView",
    "NSText",
    "NSTextField",
    "NSTextInputContext",
    "NSTextView",
    "NSTrackingArea",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSViewController",
    "NSWindow",
    "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "CFDictionary",
    "CFNumber",
    "CFRunLoop",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "CGColor",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGError",
    "CGEvent",
    "CGEventTypes",
    "CGPath",
    "CGRemoteOperation",
    "CGSession",
    "CGWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSGeometry",
    "NSIndexSet",
    "NSNotification",
    "NSObjCRuntime",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "NSUserDefaults",
    "NSValue",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CAAnimation",
    "CALayer",
    "CAMediaTiming",
    "CAShapeLayer",
    "CATransaction",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
