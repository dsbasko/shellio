[package]
name = "probe-appkit-shell"
description = "Проба P0.2: AppKit-каркас на objc2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
block2 = "0.6.2"
dispatch2 = { version = "0.3.0", default-features = false, features = ["std", "objc2"] }
libc = "0.2.191"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSPopUpButton",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSText",
    "NSTextField",
    "NSTextInputContext",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFDictionary",
    "CFNumber",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGError",
    "CGEvent",
    "CGEventTypes",
    "CGRemoteOperation",
    "CGSession",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSDate",
    "NSEnumerator",
    "NSGeometry",
    "NSNotification",
    "NSObjCRuntime",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSTimer",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std"] }

[lints]
workspace = true
