[package]
name = "probe-review-api"
description = "Проба P0.7: API ревью GitHub и GitLab, журнал черновиков и forge-fake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "probe-review"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.43.0", default-features = false, features = ["fallible_uint"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1_smol = { version = "1.0.1", default-features = false }
tiny_http = { version = "0.12.0", default-features = false }
ureq = { version = "3.5.2", default-features = false, features = ["native-tls-no-default"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
