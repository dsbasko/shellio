[package]
name = "probe-ghostty-surface"
description = "Проба P0.3: поверхность libghostty в NSView"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
block2 = "0.6.2"
dispatch2 = { version = "0.3.0", default-features = false, features = ["std", "objc2"] }
libc = "0.2.191"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "NSAccessibility",
    "NSAccessibilityConstants",
    "NSAppearance",
    "NSApplication",
    "NSBitmapImageRep",
    "NSColor",
    "NSColorSpace",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImageRep",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSSplitView",
    "NSSplitViewController",
    "NSSplitViewItem",
    "NSText",
    "NSTextField",
    "NSTextInputClient",
    "NSTextInputContext",
    "NSTextView",
    "NSView",
    "NSViewController",
    "NSWindow",
    "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "CFArray",
    "CFDictionary",
    "CFNumber",
    "CFRunLoop",
    "CFString",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "CGColor",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGEvent",
    "CGEventSource",
    "CGEventTypes",
    "CGRemoteOperation",
    "CGSession",
    "CGWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSGeometry",
    "NSKeyValueObserving",
    "NSNotification",
    "NSObjCRuntime",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSTimer",
    "NSValue",
] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "objc2",
    "objc2-core-foundation",
    "IOSurfaceRef",
    "IOSurfaceTypes",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-io-surface",
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLDevice",
    "MTLPixelFormat",
    "MTLRenderCommandEncoder",
    "MTLRenderPass",
    "MTLResource",
    "MTLTexture",
    "MTLTypes",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CADisplayLink",
    "CALayer",
    "CATransaction",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellio-sys-ghostty = { path = "../../crates/shellio-sys-ghostty" }

[lints]
workspace = true
