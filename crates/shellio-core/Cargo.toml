[package]
name = "shellio-core"
description = "Ядро shellio: идентификаторы, модель, команды, события и актор состояния"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-support = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
shellio-core = { path = ".", features = ["test-support"] }
tempfile = "3.27.0"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "macros"] }

[lints]
workspace = true
