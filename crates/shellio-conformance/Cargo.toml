[package]
name = "shellio-conformance"
description = "Сверка с прототипом: паспорт и его каноническая запись, годность, сцена, рецепт, реестр, таблица ключей и контракт полей"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
png = "0.18.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
tungstenite = { version = "0.28", optional = true }

[features]
default = ["snap"]
# Съёмщик паспортов: транспорт CDP. Библиотека без него чистая.
snap = ["dep:tungstenite"]

[[bin]]
name = "shellio-snap"
required-features = ["snap"]

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
