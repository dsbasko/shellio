[package]
name = "shellio-appkit"
description = "Безопасный слой shellio над AppKit: приложение, главный поток, владение видами, тема и монитор цикла"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
block2 = "0.6.2"
dispatch2 = { version = "0.3.0", default-features = false, features = ["std", "objc2"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "NSAccessibility",
    "NSAccessibilityConstants",
    "NSAccessibilityProtocols",
    "NSAppearance",
    "NSAttributedString",
    "NSApplication",
    "NSBezierPath",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSClipView",
    "NSColor",
    "NSColorSpace",
    "NSControl",
    "NSCursor",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageView",
    "NSLayoutConstraint",
    "NSLayoutManager",
    "NSMenu",
    "NSMenuItem",
    "NSOutlineView",
    "NSPanel",
    "NSParagraphStyle",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSScrollView",
    "NSScroller",
    "NSSplitView",
    "NSSplitViewController",
    "NSSplitViewItem",
    "NSStringDrawing",
    "NSTableCellView",
    "NSTableColumn",
    "NSTableHeaderView",
    "NSTableRowView",
    "NSTableView",
    "NSText",
    "NSTextField",
    "NSTrackingArea",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSViewController",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSIndexSet",
    "NSNotification",
    "NSObjCRuntime",
    "NSOperation",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSThread",
    "NSURL",
    "NSUserDefaults",
    "NSValue",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "CFArray",
    "CFRunLoop",
    "CFString",
    "CFURL",
] }
objc2-core-text = { version = "0.3.2", default-features = false, features = [
    "std",
    "CTFontDescriptor",
    "CTFontManager",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CAAnimation",
    "CABase",
    "CADisplayLink",
    "CALayer",
    "CAMediaTiming",
    "CAMediaTimingFunction",
    "CATransaction",
] }
shellio-theme = { path = "../shellio-theme" }

[lints]
workspace = true
