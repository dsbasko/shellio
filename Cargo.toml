[workspace]
resolver = "3"
members = [
    "apps/shellio",
    "crates/shellio-ghostty",
    "crates/shellio-sys-ghostty",
    "spikes/probe-appkit-shell",
    "spikes/probe-diff-view",
    "spikes/probe-ghostty-surface",
    "spikes/probe-session-survival",
    "spikes/probe-update-lifecycle",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
