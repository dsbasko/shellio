[workspace]
resolver = "3"
members = [
    "apps/shellio",
    "crates/shellio-ghostty",
    "crates/shellio-sys-ghostty",
    "spikes/probe-appkit-shell",
    "spikes/probe-diff-view",
    "spikes/probe-ghostty-surface",
    "spikes/probe-resource-accounting",
    "spikes/probe-review-api",
    "spikes/probe-session-survival",
    "spikes/probe-update-lifecycle",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# Разбор tree-sitter в тестах пробы P0.6 идёт по 100 000 строк: C-код грамматики и библиотеки
# в тестовом профиле собирается с оптимизацией, остальной код — как обычно.
[profile.dev.package.tree-sitter]
opt-level = 3

[profile.dev.package.tree-sitter-rust]
opt-level = 3
