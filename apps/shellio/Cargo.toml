[package]
name = "shellio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
plugin-demo-list = { path = "../../plugins/demo-list" }
plugin-demo-native = { path = "../../plugins/demo-native" }
plugin-navigator = { path = "../../plugins/navigator" }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
plugin-terminal = { path = "../../plugins/terminal" }
serde_json = "1.0"
shellio-appkit = { path = "../../crates/shellio-appkit" }
shellio-control = { path = "../../crates/shellio-control" }
shellio-core = { path = "../../crates/shellio-core" }
shellio-ghostty = { path = "../../crates/shellio-ghostty" }
shellio-keymap = { path = "../../crates/shellio-keymap" }
shellio-layout = { path = "../../crates/shellio-layout" }
shellio-plugin-api = { path = "../../crates/shellio-plugin-api" }
shellio-plugin-view = { path = "../../crates/shellio-plugin-view" }
shellio-store = { path = "../../crates/shellio-store" }
shellio-theme = { path = "../../crates/shellio-theme" }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
shellio-conformance = { path = "../../crates/shellio-conformance" }
shellio-control = { path = "../../crates/shellio-control", features = ["test-support"] }
shellio-core = { path = "../../crates/shellio-core", features = ["test-support"] }
tempfile = "3.27.0"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "test-util"] }

[lints]
workspace = true
