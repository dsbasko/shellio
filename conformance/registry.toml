# Исключения: таблицы «Исключения этого плана» планов prototype-conformance, conformance-closure, navigation-keymap и command-overlays.

[[exception]]
states = ["chrome-titlebar", "layout-default", "layout-all-zones", "layout-left-plate", "layout-split-right", "layout-split-center", "layout-split-bottom", "layout-zoom", "tabs-side", "tabs-center", "tabs-half", "tabs-wide", "layout-stub", "layout-empty-workbench", "menu-panel", "picker-new-part", "panel-filter", "status-mode-nav", "status-input-field", "palette-groups", "palette-tab-narrowed", "palette-no-results", "whichkey-leader", "whichkey-ctrlw", "hints-full", "hints-partial"]
fields = ["frame", "radius", "fill"]
adr = "ADR-0023"
reason = "Кнопки окна системные: кадр, диаметр и заливку задаёт macOS"
[exception.scope]
keys = ["chrome.window.*"]

[[exception]]
states = ["chrome-titlebar", "layout-default", "layout-all-zones", "layout-left-plate", "layout-split-right", "layout-split-center", "layout-split-bottom", "layout-zoom", "tabs-side", "tabs-center", "tabs-half", "tabs-wide", "layout-stub", "layout-empty-workbench", "menu-panel", "picker-new-part", "panel-filter", "status-mode-nav", "status-input-field", "palette-groups", "palette-tab-narrowed", "palette-no-results", "whichkey-leader", "whichkey-ctrlw", "hints-full", "hints-partial"]
fields = ["frame_x"]
adr = "ADR-0023"
reason = "Начало кнопки воркспейса следует за системными кнопками окна: 81 против 84"
[exception.scope]
keys = ["chrome.workspace"]

[[exception]]
states = ["menu-panel"]
fields = ["composition", "all"]
adr = "ADR-0023"
reason = "Раскрытое меню — системный NSMenu без узлов меню, пунктов и разделителя: название, порядок и доступность пунктов сверяются по ui.inspect"
[exception.scope]
keys = ["zone.center.part.1.menu", "zone.center.part.1.menu.item.*", "zone.center.part.1.menu.separator.*"]

[[exception]]
states = ["picker-new-part"]
fields = ["composition", "all"]
adr = "ADR-0023"
reason = "Выбор «Открыть в новой части» — системный NSMenu: узел picker — место привязки меню, узлов заголовка и пунктов нет; название, порядок и доступность пунктов сверяются по ui.inspect"
[exception.scope]
keys = ["picker", "picker.*"]

[[exception]]
states = ["picker-new-part"]
fields = ["icon_mask"]
adr = "ADR-0037"
reason = "Эталонная маска кнопок строки вкладок снята под тенью выбора прототипа, системный выбор продукта ложится на кнопки иначе: имя, размер и место значка сверяются"
[exception.scope]
keys = ["zone.bottom.part.1.tabs.menu.icon", "zone.bottom.part.1.tabs.zoom.icon", "zone.bottom.part.1.tabs.split.icon"]

[[exception]]
fields = ["all"]
adr = "ADR-0037"
reason = "Галерея компонентов P1.3: состояний галереи в реестре нет"
[exception.scope]
mode = "gallery"

[[exception]]
states = ["layout-default", "layout-all-zones", "layout-left-plate", "layout-split-right", "layout-split-center", "layout-split-bottom", "layout-zoom", "tabs-side", "tabs-center", "tabs-half", "tabs-wide", "layout-stub", "layout-empty-workbench", "menu-panel", "picker-new-part", "panel-filter", "status-mode-nav", "status-input-field", "palette-groups", "palette-tab-narrowed", "palette-no-results", "whichkey-leader", "whichkey-ctrlw", "hints-full", "hints-partial"]
